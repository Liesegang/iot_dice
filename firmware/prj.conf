CONFIG_CPP=y

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_PINCTRL=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="dice"
CONFIG_BT_MAX_CONN=1
# Largest notify payload = 58 bytes (STREAM) → ATT PDU = 61 → L2CAP ≥ 61
# Set MTU with headroom and matching ACL buffers
CONFIG_BT_L2CAP_TX_MTU=80
CONFIG_BT_BUF_ACL_RX_SIZE=86
CONFIG_BT_BUF_ACL_TX_SIZE=86
# Peripheral-requested 2M PHY for latency
CONFIG_BT_USER_PHY_UPDATE=y

CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

# printfをJ-Link RTTに出す
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# printf("%f") 用（NCS 3.4.0ではPicolibcが既定）
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_MAIN_STACK_SIZE=8192

CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

CONFIG_HWINFO=y
