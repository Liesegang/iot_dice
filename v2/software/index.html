<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoT Dice v2</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        background: #0d0d1a;
        color: #e8e4db;
        font-family: 'SF Mono', 'Fira Code', monospace;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      #app {
        min-height: 0;
        flex: 1;
        position: relative;
      }

      #app > canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      /* ── prediction overlay ─────────────────────────────────────────── */
      #prediction {
        position: absolute;
        top: 1rem;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        pointer-events: none;
        transition: opacity 0.25s;
        opacity: 0;
      }

      #prediction.visible { opacity: 1; }

      #pred-face {
        font-size: 3rem;
        font-weight: 900;
        line-height: 1;
        text-shadow: 0 0 40px currentColor;
        transition: color 0.3s;
      }

      #pred-face.uncertain { color: #e8a030; }
      #pred-face.locked    { color: #40e080; animation: pop 0.25s ease-out; }
      #pred-face.degraded  { color: #e05050; }

      @keyframes pop {
        0%   { transform: scale(0.7); }
        60%  { transform: scale(1.12); }
        100% { transform: scale(1); }
      }

      #pred-label {
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        margin-top: 0.3rem;
        opacity: 0.65;
      }

      /* ── probability distribution bars ──────────────────────────────── */
      #dist {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        margin-top: 0.8rem;
        height: 46px;
        align-items: flex-end;
      }

      .dist-col { width: 22px; text-align: center; }

      .dist-bar {
        width: 100%;
        background: #e8a030;
        border-radius: 2px 2px 0 0;
        min-height: 1px;
        transition: height 0.2s;
      }

      .dist-num { font-size: 0.6rem; opacity: 0.6; margin-top: 2px; }

      /* ── top-left info ──────────────────────────────────────────────── */
      #info {
        position: absolute;
        top: 0.8rem;
        left: 1rem;
        font-size: 0.7rem;
        color: #4a6a8a;
        line-height: 1.7;
        pointer-events: none;
      }

      /* ── bottom HUD ─────────────────────────────────────────────────── */
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding: 1.5rem;
        gap: 0.6rem;
      }

      #status {
        font-size: 0.8rem;
        color: #a09888;
      }

      #hud .row {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        justify-content: center;
      }
      [hidden] { display: none !important; }

      button {
        pointer-events: all;
        background: #1e2a3a;
        color: #93b4d0;
        border: 1px solid #2d4260;
        border-radius: 8px;
        padding: 0.6rem 1.4rem;
        font-family: inherit;
        font-size: 0.85rem;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }

      button:hover:not(:disabled) {
        background: #25364a;
        border-color: #4a6fa0;
      }

      button:disabled { opacity: 0.5; cursor: not-allowed; }

      button.small { padding: 0.35rem 0.7rem; font-size: 0.75rem; }

      /* ── calibration panel ──────────────────────────────────────────── */
      #calib-panel {
        position: absolute;
        right: 1rem;
        top: 1rem;
        background: #131325ee;
        border: 1px solid #2d4260;
        border-radius: 10px;
        padding: 1rem;
        display: none;
        flex-direction: column;
        gap: 0.5rem;
        pointer-events: all;
      }

      #calib-panel.open { display: flex; z-index: 3; }

      #calib-panel p {
        font-size: 0.7rem;
        color: #a09888;
        max-width: 200px;
        line-height: 1.5;
      }

      #calib-faces {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.4rem;
      }

      #calib-faces button.done {
        border-color: #40e080;
        color: #40e080;
      }
      #learn-panel {
        display: none; position: absolute; top: 1rem; left: 1rem;
        width: 340px; max-width: calc(100% - 2rem); max-height: calc(100% - 10rem);
        overflow: auto; background: #131325f5; border: 1px solid #2d4260;
        border-radius: 10px; padding: 1rem; pointer-events: all;
        font-size: 0.75rem; line-height: 1.6;
      }
      #learn-panel.open { display: block; }
      #learn-panel h2 { font-size: 1rem; margin-bottom: 0.5rem; }
      #learn-panel p { margin: 0.6rem 0; color: #aeb6c6; }
      #learn-panel label { display: block; margin: 0.4rem 0; }
      #learn-panel input:not([type=checkbox]) {
        width: 100%; background: #0d0d1a; color: #e8e4db; border: 1px solid #2d4260;
        padding: 0.4rem; border-radius: 5px; font: inherit;
      }
      #learn-panel .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0; }
      #learning-status { color: #e8a030; white-space: pre-line; }
      #motion-charts {position:absolute;right:1rem;top:1rem;width:320px;max-width:calc(100% - 2rem);max-height:calc(100% - 9rem);overflow:auto;pointer-events:auto;}
      #learn-panel {z-index:3;}
      #learning-readiness {color:#e8a030 !important;}
      .review-row {padding:.4rem 0;border-top:1px solid #2d4260;}
      .review-row button {margin:0 .2rem .2rem 0;}
      @media(max-width:650px) {
        #motion-charts {top:auto;bottom:10rem;width:260px;opacity:.9;}
        #info {max-width:calc(100% - 2rem);}
        #hud {padding:1rem;}
      }
      #label-row { align-items: center; font-size: 0.8rem; }
      #label-row button.done { border-color: #40e080; color: #40e080; }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- prediction overlay (center of canvas) -->
      <div id="prediction">
        <div id="pred-face" class="uncertain"></div>
        <div id="pred-label"></div>
        <div id="dist"></div>
      </div>

      <!-- top-left telemetry -->
      <div id="info">
        <div id="state"></div>
        <div id="omega"></div>
        <div id="up-face">上面：6面校正待ち</div>
        <div id="stats"></div>
        <div id="training-indicator">未学習・初期値</div>
        <div id="trajectory-status">推定軌跡：動作待ち（静止中は非表示）</div>
      </div>

      <div id="motion-charts" aria-label="角速度と加速度の時系列グラフ"></div>

      <!-- calibration panel -->
      <div id="calib-panel">
        <p>その面を上にして静置し、番号を押すと登録されます。6面登録でキャリブレーション完了。</p>
        <div id="calib-faces"></div>
        <button class="small" id="calib-reset">リセット</button>
      </div>

      <!-- bottom HUD -->
      <div id="learn-panel">
        <h2>初回衝突から出目を予測</h2>
        <p>①6面を校正 → ②予測をONにして投げる → ③静止後に実際の目を選ぶ。学習に使わない検証・テスト投擲も保存します。</p>
        <label>投げる面の名前<input id="surface-input" value="試験面1（未指定）" maxlength="80" /></label>
        <label>1辺の長さ（mm）<input id="size-input" type="number" value="15" min="8" max="100" step="0.1" /></label>
        <label>角丸の半径（mm）<input id="corner-input" type="number" value="0.8" min="0" max="10" step="0.1" /></label>
        <button id="profile-apply" class="small">設定を適用</button>
        <p id="model-summary"></p>
        <p id="learning-data"></p>
        <p id="learning-readiness"></p>
        <p id="learning-last-run">学習実行履歴なし</p>
        <label><input type="checkbox" id="auto-learn" checked /> 正解確認が10投増えるごとに学習</label>
        <div class="actions">
          <button id="train-btn" class="small" disabled>強化学習する</button>
          <button id="stop-training-btn" class="small" disabled>学習を停止</button>
          <button id="import-btn" class="small">記録・モデルを読む</button>
          <button id="model-export-btn" class="small">モデルDL</button>
        </div>
        <input type="file" id="import-file" accept="application/json,.json" hidden />
        <p id="learning-status">実際の出目を確認した記録でパラメータを更新します。投げるだけでは学習されません。</p>
        <details><summary>未確認の記録に正解を付ける</summary><p>出目を覚えている記録だけ確認してください。</p><div id="label-review"></div></details>
      </div>
      <div id="hud">
        <div id="label-row" class="row" hidden><span id="label-caption">実際の目</span></div>
        <div id="status">未接続</div>
        <div class="row">
          <button id="connect-btn">🎲 サイコロを接続</button>
          <button id="simulation-btn" class="small">予測 OFF</button>
          <button id="trajectory-btn" class="small" aria-pressed="true">軌跡 ON</button>
          <button id="trail-clear-btn" class="small">軌跡を消す</button>
          <button id="calib-btn" class="small">面校正</button>
          <button id="learn-btn" class="small">学習</button>
          <button id="export-btn" class="small">記録DL</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
