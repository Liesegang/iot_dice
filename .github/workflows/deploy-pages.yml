name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "v1/software/**"
      - "v2/software/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            v1/software/package-lock.json
            v2/software/package-lock.json

      - name: Install v1 dependencies
        working-directory: v1/software
        run: npm ci

      - name: Build v1
        working-directory: v1/software
        run: npm run build

      - name: Install v2 dependencies
        working-directory: v2/software
        run: npm ci

      - name: Build v2
        working-directory: v2/software
        run: npm run build

      - name: Assemble versioned site
        run: |
          mkdir -p site/v1 site/v2
          cp -R v2/software/dist/. site/
          cp -R v1/software/dist/. site/v1/
          cp -R v2/software/dist/. site/v2/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
